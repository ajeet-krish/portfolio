                                <td style="padding: 6px 10px;">Vallado Spacetrack Report #3</td>

                            </tr>
                            <tr style="border-bottom: 1px solid var(--current-line);">
                                <td style="padding: 6px 10px;">J2 acceleration</td>
                                <td style="padding: 6px 10px;">Analytical formula (Vallado Eq. 8-20)</td>

                                <td style="padding: 6px 10px;">Closed-form solution</td>

                                <td style="padding: 6px 10px;">10x on Apple M5</td>
                            </tr>
                        </table>
                    </div>
                    `
                }
            },
            'astrosim': {
                type: 'report',
                title: 'AstroSim: Real-Time Spacecraft ADCS Simulator',
                meta: 'C++17, Eigen3, Dear ImGui, OpenGL',
                summary: 'Real-time spacecraft attitude determination and control system simulator with 3D ground control station.',
                thumbnail: null,
                accent: 'var(--pink)',
                tier: 'compact',
                tags: ['C++', 'ADCS', 'GNC', 'Space', 'ImGui', 'OpenGL'],
                tabs: ['Overview', 'Architecture'],
                content: {
                    'overview': `
                    <div class="modal-description">
                        <p style="font-size: 15px; line-height: 1.8;">
                            Production-grade <span style="color: var(--cyan);">spacecraft ADCS simulator</span> demonstrating GNC

                            magnetic field modeling</span>, multi-source sensor emulation, attitude determination
                            (<span style="color: var(--green);">TRIAD, QUEST, Error-State EKF</span>), multi-mode control,
                            and a <span style="color: var(--pink);">C++ ImGui + OpenGL ground control station</span> with 3D CubeSat renderer.

                            <a href="https://github.com/ajeet-krish/AstroSim" target="_blank" class="download-btn">[ GitHub Repo ]</a>

                    </div>
                    `,
                    'architecture': `
                    <div class="modal-description" style="margin-bottom: 20px;">
                        <p style="font-size: 15px; line-height: 1.8;">
                            Header-only C++ library in the <span style="color: var(--cyan);">adcs namespace</span>.
                            Built as a CMake INTERFACE target. 16 test files with 193 passing tests.
                        </p>
                    </div>
                    <div class="card" style="border-color: var(--green); padding: 15px 20px;">
                        <div style="color: var(--cyan); font-weight: bold; margin-bottom: 8px; font-size: 16px;">// Module Stack</div>

        function renderProjectCards() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';

            // Hardcoded display order
            const heroOrder = ['cfd-solver', 'fea-solver', 'zenith'];
            const compactOrder = ['swarm', 'astrosim', 'airfoil-cfd', 'soccer', 'capstone', 'f1', 'orbital'];

            // Tag color map
            const tagColors = {
                'C++': 'var(--cyan)', 'C++20': 'var(--cyan)', 'C++17': 'var(--cyan)',
                'Python': 'var(--cyan)',
                'Rust': 'var(--orange)',
                'React': 'var(--cyan)',
                'CFD': 'var(--pink)', 'CFD': 'var(--pink)',
                'FEA': 'var(--pink)', 'Structural': 'var(--pink)',
                'GNC': 'var(--green)', 'Controls': 'var(--green)', 'ADCS': 'var(--green)',
                'HPC': 'var(--green)', 'OpenMP': 'var(--green)',
                'Space': 'var(--purple)', 'Astrodynamics': 'var(--purple)',
                'GPU': 'var(--purple)',
                'Qt 6': 'var(--orange)',
                'SU2': 'var(--orange)', 'PhiFlow': 'var(--orange)',
                'MATLAB': 'var(--orange)', 'CAD': 'var(--orange)', 'SolidWorks': 'var(--orange)',
                'Telemetry': 'var(--green)', 'Plotly': 'var(--green)',
                'Matplotlib': 'var(--green)',
                'Optimization': 'var(--pink)',
            };

            function tagHTML(tag) {
                const color = tagColors[tag] || 'var(--comment)';
                return `<span class="tag" style="color: ${color}; border: 1px solid ${color};">${tag}</span>`;
            }

            // Hero section
            const heroGrid = document.createElement('div');
            heroGrid.className = 'bento-hero-grid';

            for (const id of heroOrder) {
                const project = projectData[id];
                if (!project) continue;
                const card = document.createElement('div');
                card.className = 'bento-hero-card';
                card.style.setProperty('--card-accent', project.accent);
                card.onclick = () => openProject(id);

                const thumbHTML = project.thumbnail
                    ? `<img src="${project.thumbnail}" alt="${project.title}" loading="lazy">`
                    : `<div class="bento-thumb-fallback">// ${project.tags[0]}</div>`;

                card.innerHTML = `
                    <div class="bento-hero-thumb">${thumbHTML}</div>
                    <div class="bento-hero-info">
                        <div class="bento-hero-title">${project.title.split(':')[0]}</div>
                        <div class="bento-hero-summary">${project.summary}</div>
                        <div class="bento-hero-tags">
                            ${project.tags.map(t => tagHTML(t)).join('')}
                        </div>
                    </div>
                `;
                heroGrid.appendChild(card);
            }
            grid.appendChild(heroGrid);

            // Compact section
            const compactGrid = document.createElement('div');
            compactGrid.className = 'bento-compact-grid';

            for (const id of compactOrder) {
                const project = projectData[id];
                if (!project) continue;
                const card = document.createElement('div');
                card.className = 'bento-compact-card';
                card.style.setProperty('--card-accent', project.accent);
                card.onclick = () => openProject(id);

                const thumbHTML = project.thumbnail
                    ? `<img src="${project.thumbnail}" alt="${project.title}" loading="lazy">`
                    : `<div class="bento-thumb-fallback">// ${project.tags[0]}</div>`;

                card.innerHTML = `
                    <div class="bento-compact-thumb">${thumbHTML}</div>
                    <div class="bento-compact-info">
                        <div class="bento-compact-title">${project.title.split(':')[0]}</div>
                        <div class="bento-compact-summary">${project.summary}</div>
                        <div class="bento-compact-tags">
                            ${project.tags.map(t => tagHTML(t)).join('')}
                        </div>
                    </div>
                `;
                compactGrid.appendChild(card);
            }
            grid.appendChild(compactGrid);
        }

        // Render cards on page load
        renderProjectCards();

        function openProject(id) {
            const project = projectData[id];
            const modal = document.getElementById('project-modal');
            const container = document.getElementById('modal-container');
            const tabsContainer = document.getElementById('modal-tabs');
            const body = document.getElementById('modal-body');

            // Reset modal state
            document.getElementById('modal-title').innerText = project.title;
            document.getElementById('modal-meta').innerText = project.meta;

            // Wide modal for reports only
            if (project.type === 'report') {
                container.classList.add('wide');
                tabsContainer.style.display = 'flex';
            } else {
                container.classList.remove('wide');
                tabsContainer.style.display = 'none';
            }

            // Gallery = direct content, Report = tabbed content
            if (project.type === 'gallery') {
                body.innerHTML = project.content;
            } else {
                tabsContainer.innerHTML = '';
                project.tabs.forEach((tab, index) => {
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = `[ 0${index + 1}. ${tab} ]`;
                    btn.onclick = () => switchTab(id, tab.toLowerCase());
                    tabsContainer.appendChild(btn);
                });
                body.innerHTML = project.content[project.tabs[0].toLowerCase()];
            }

            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function switchTab(projectId, tabKey) {
            const project = projectData[projectId];
            const body = document.getElementById('modal-body');

            // Update Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase().includes(tabKey)) {
                    btn.classList.add('active');
                }
            });

            // Markdown-powered Full Report tab
            if (tabKey === 'full report') {
                body.style.padding = '20px';
                body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--comment);">Loading design document...</div>';
                fetch('assets/projects/capstone/PROJECT_CAPSTONE.md')
                    .then(res => {
                        if (!res.ok) throw new Error('Failed to fetch');
                        return res.text();
                    })
                    .then(md => {
                        body.innerHTML = '<div class="markdown-body">' + marked.parse(md) + '</div>';
                    })
                    .catch(() => {
                        body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--orange);">Failed to load design document.</div>';
                    });
                return;
            }

            // Update Content
            body.innerHTML = project.content[tabKey];
        }

        function closeModal() {
            const modal = document.getElementById('project-modal');
            modal.style.display = "none";
            document.body.style.overflow = "auto";
        }

        window.onclick = function (event) {
            const modal = document.getElementById('project-modal');
            if (event.target == modal) closeModal();
        }
    </script>
