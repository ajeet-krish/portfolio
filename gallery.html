    <!-- Project Modal -->
    <div id="project-modal" class="modal">
        <div id="modal-container" class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-header-content">
                <h2 id="modal-title" style="color: var(--orange); margin: 0;"></h2>
                <div id="modal-meta" class="card-meta" style="margin-top: 5px;"></div>
            </div>
            <div id="modal-tabs" class="modal-tabs" style="margin-top: 20px; display: none;">
                <!-- Tabs injected by JS -->
            </div>
            <div id="modal-body" class="modal-body-content">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <script>
        const projectData = {
            'crankshaft': {
                type: 'gallery',
                title: 'Crankshaft Assembly',
                meta: 'Autodesk Fusion',
                content: `
                <div class="pinterest-hero">
                    <div class="hero-media">
                        <div class="modal-media-container" style="aspect-ratio: 1/1;">
                            <video controls loop muted autoplay>
                                <source src="assets/projects/crankshaft/crankshaft animated.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                    <div class="hero-specs">
                        <div style="color: var(--cyan); font-weight: bold; margin-bottom: 8px; font-size: 16px;">// Technical Specifications</div>
                        <ul style="list-style-type: none; padding: 0; font-size: 15px; line-height: 1.8;">
                            <li><span style="color: var(--orange);">Software:</span> Autodesk Fusion</li>
                            <li><span style="color: var(--orange);">Components:</span> 12+ Interlocking</li>
                            <li style="margin-top: 10px;">Detailed assembly focusing on internal combustion stroke mechanics and rotational balancing.</li>
                        </ul>
                    </div>
                </div>
            `
            }
        };

        function openProject(id) {
            const project = projectData[id];
            const modal = document.getElementById('project-modal');
            const container = document.getElementById('modal-container');
            const tabsContainer = document.getElementById('modal-tabs');
            const body = document.getElementById('modal-body');

            document.getElementById('modal-title').innerText = project.title;
            document.getElementById('modal-meta').innerText = project.meta;

            if (project.type === 'report') {
                container.classList.add('wide');
                tabsContainer.style.display = 'flex';
            } else {
                container.classList.remove('wide');
                tabsContainer.style.display = 'none';
            }

            if (project.type === 'gallery') {
                body.innerHTML = project.content;
            } else {
                tabsContainer.innerHTML = '';
                project.tabs.forEach((tab, index) => {
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = `[ 0${index + 1}. ${tab} ]`;
                    btn.onclick = () => switchTab(id, tab.toLowerCase());
                    tabsContainer.appendChild(btn);
                });
                body.innerHTML = project.content[project.tabs[0].toLowerCase()];
            }

            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function switchTab(projectId, tabKey) {
            const project = projectData[projectId];
            const body = document.getElementById('modal-body');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase().includes(tabKey)) {
                    btn.classList.add('active');
                }
            });
            body.innerHTML = project.content[tabKey];
        }

        function closeModal() {
            const modal = document.getElementById('project-modal');
            modal.style.display = "none";
            document.body.style.overflow = "auto";
        }

        window.onclick = function (event) {
            const modal = document.getElementById('project-modal');
            if (event.target == modal) closeModal();
        }
    </script>
